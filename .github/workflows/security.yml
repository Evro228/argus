name: Security Audit & Testing Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-audit:
    name: Gitleaks & Automated Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Semgrep SAST Security Scanner
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
        continue-on-error: true

      - name: Run Google OSV-Scanner (Supply Chain & SCA)
        uses: google/osv-scanner-action@v1.9.0
        with:
          scan-args: |-
            --lockfile=requirements.txt
            --lockfile=package.json
        continue-on-error: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Run Bandit AST Security Linter
        run: |
          bandit -r backend/app/ -ll

      - name: Run Full Security & Functional Test Suite
        run: |
          python tests/test_suite.py

      - name: Run Heavy Concurrency Stress Test
        run: |
          python tests/stress_test.py
